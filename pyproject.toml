[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercut"
version = "0.1.0"
description = "Automatic short-form video editor: transcribe, caption, find the hook, add motion graphics."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
whisper = ["faster-whisper>=1.0"]
deepgram = ["httpx>=0.27"]
reframe = ["mediapipe>=0.10", "opencv-python-headless>=4.9"]
matte = ["mediapipe>=0.10", "opencv-python-headless>=4.9", "numpy>=1.24"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
anthropic = ["anthropic>=1.0"]

[tool.setuptools.packages.find]
include = ["hypercut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
